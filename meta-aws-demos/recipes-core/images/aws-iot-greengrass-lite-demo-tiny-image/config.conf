DISTRO = "poky-altcfg"

QB_MEM = "-m 2048"

IMAGE_OVERHEAD_FACTOR = "2"

BOOT_SPACE = "69152"

# just necessary if aws-iot-device-client is installed
PACKAGECONFIG:pn-aws-iot-device-client = "st"

DISTRO_FEATURES:remove = " ptest"

# OSPO license compliance
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"
BB_GENERATE_MIRROR_TARBALLS = "1"
BB_GIT_SHALLOW = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
INHERIT += "create-spdx"

TCLIBC = "musl"

FULL_OPTIMIZATION = "-Os -pipe ${DEBUG_LEVELFLAG}"

PACKAGE_CLASSES ?= "package_ipk"

# This image is systemd-based; select systemd explicitly since the base
# poky-altcfg distro defaults to sysvinit on musl (and the two cannot coexist).
INIT_MANAGER = "systemd"


# We can use packagegroup-core-boot, but in the future we may need a new packagegroup-core-tiny
#POKY_DEFAULT_EXTRA_RDEPENDS += "packagegroup-core-boot"
# Drop kernel-module-af-packet from RRECOMMENDS
POKY_DEFAULT_EXTRA_RRECOMMENDS = ""

# Disable wide char support for ncurses as we don't include it in
# in the LIBC features below.
# Leave native enable to avoid build failures
ENABLE_WIDEC = "false"
ENABLE_WIDEC:class-native = "true"

# Drop native language support. This removes the
# eglibc->bash->gettext->libc-posix-clang-wchar dependency.
USE_NLS = "no"
# As we don't have native language support, don't install locales into images
IMAGE_LINGUAS = ""

# Comment out any of the lines below to disable them in the build
# DISTRO_FEATURES options:
# alsa bluetooth ext2 pcmcia usbgadget usbhost wifi nfs zeroconf pci
DISTRO_FEATURES_TINY = "pci"
DISTRO_FEATURES_NET = "ipv4 ipv6"
DISTRO_FEATURES_USB = "usbhost"
#DISTRO_FEATURES_USBGADGET = "usbgadget"
DISTRO_FEATURES_WIFI = "wifi"

DISTRO_FEATURES = "${DISTRO_FEATURES_TINY} \
                   ${DISTRO_FEATURES_NET} \
                   ${DISTRO_FEATURES_USB} \
                   ${DISTRO_FEATURES_USBGADGET} \
                   ${DISTRO_FEATURES_WIFI} \
                  "

DISTRO_FEATURES:class-native = "${DISTRO_FEATURES_DEFAULTS} ${POKY_DEFAULT_DISTRO_FEATURES}"
DISTRO_FEATURES:class-nativesdk = "${DISTRO_FEATURES_DEFAULTS} ${POKY_DEFAULT_DISTRO_FEATURES}"

# FIXME: Consider adding "modules" to MACHINE_FEATURES and using that in
# packagegroup-core-base to select modutils-initscripts or not.  Similar with "net" and
# netbase.

# Drop v86d from qemu dependency list (we support serial)
# Drop grub from meta-intel BSPs
# FIXME: A different mechanism is needed here. We could define -tiny
#        variants of all compatible machines, but that leads to a lot
#        more machine configs to maintain long term.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""

# The mtrace script included by eglibc is a perl script. This means the system
# will build perl in case this package is installed. Since we don't care about
# this script for the purposes of tiny, remove the dependency from here.
RDEPENDS:${PN}-mtrace:pn-eglibc = ""

SKIP_RECIPE[build-appliance-image] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-rt] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-rt-sdk] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-sato] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-sato-dev] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-sato-sdk] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-x11] = "not buildable with poky-tiny"
SKIP_RECIPE[core-image-weston] = "not buildable with poky-tiny"

# Disable python usage in opkg-utils since it won't build with tiny config
PACKAGECONFIG:remove:pn-opkg-utils = "python"


NO_RECOMMENDATIONS = "1"

# NOTE: this musl image does not yet build fully. meta-oe's sdbus-c++-libsystemd
# 259.5 dropped its musl patch series (needed by greengrass-lite -> sdbus-c++),
# so it fails to compile on musl. Tracked upstream at
# https://github.com/openembedded/meta-openembedded/issues/1071. Once the musl
# patches are restored in meta-oe and the submodule pin is advanced, this image
# should build without further changes here.

# meta-oe's ostree_2026.1.bb fails bitbake shell pre-parsing (pysh NeedMore in
# oe_runconf) under this image's minimal musl DISTRO_FEATURES set, halting the
# whole parse. It parses fine under a normal glibc config and is not used by
# this image, so mask it out here.
BBMASK += "meta-openembedded/meta-oe/recipes-extended/ostree/ostree_.*\.bb"
