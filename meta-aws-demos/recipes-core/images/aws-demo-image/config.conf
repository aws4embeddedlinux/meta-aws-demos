# Included into local.conf for aws-demo-image (see conf/templates/default/local.conf.sample).

# This image needs ONE shared CRT stack: it installs the standalone aws-c-*/s2n/
# aws-checksums libs (also pulled in by aws-sdk-cpp). aws-crt-cpp and the SDK
# default to bundling their own copies (build-deps), which collide with the
# standalone packages. Disable build-deps on both so everything links the shared
# stack; keep other PACKAGECONFIG entries (e.g. ptest's with-tests).
# These two lines are intended image policy and should stay.
PACKAGECONFIG:remove:pn-aws-crt-cpp = "build-deps"
PACKAGECONFIG:remove:pn-aws-iot-device-sdk-cpp-v2 = "build-deps"

# UPSTREAM WORKAROUND (drop once fixed): the SDK's BUILD_DEPS=OFF path is
# incomplete. It find_package()s the CRT stack but neither DEPENDS on it nor sets
# CMAKE_PREFIX_PATH, so do_configure fails ("Could not find ... aws-crt-cpp /
# aws-c-common"). We supply both here (aws-crt-cpp already sets the prefix path;
# single prefix, no ';' list, to avoid shell splitting in run.do_configure).
# Tracked: https://github.com/aws4embeddedlinux/meta-aws/issues/17160
DEPENDS:append:pn-aws-iot-device-sdk-cpp-v2 = " \
    aws-crt-cpp \
    aws-c-auth \
    aws-c-cal \
    aws-c-common \
    aws-c-compression \
    aws-c-event-stream \
    aws-c-http \
    aws-c-io \
    aws-c-mqtt \
    aws-c-s3 \
    aws-c-sdkutils \
    aws-checksums \
    s2n \
"
EXTRA_OECMAKE:append:pn-aws-iot-device-sdk-cpp-v2 = " -DCMAKE_PREFIX_PATH=${STAGING_DIR_HOST}${prefix}"
