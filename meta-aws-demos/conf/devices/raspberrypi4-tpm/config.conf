MACHINE = "raspberrypi4-64"

IMAGE_FSTYPES ?= "wic wic.bz2"

# WIFI
DISTRO_FEATURES:append = " wifi"

# ENABLE DEBUG OVER USB
ENABLE_UART = "1"

# https://meta-raspberrypi.readthedocs.io/en/latest/ipcompliance.html
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

MACHINE_FEATURES:append = " tpm2"

ENABLE_SPI_BUS = "1"
# Use the RPi kernel's in-tree SLB9670 TPM overlay (the LetsTrust-TPM /
# Iridium SLB9670 board). meta-raspberrypi builds all in-tree overlays, so no
# custom overlay recipe is needed.
RPI_EXTRA_CONFIG = "dtoverlay=tpm-slb9670"
IMAGE_INSTALL:append = " kernel-image kernel-devicetree"

MACHINE_FEATURES += "watchdog"